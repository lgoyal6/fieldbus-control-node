[package]
name = "fieldbus-host"
description = "std host for fieldbus-core: periodic runner, deterministic simulated bus, Linux SocketCAN backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fieldbus-node"
path = "src/main.rs"

[features]
# Off by default so a plain `cargo build` on macOS never pulls a Linux-only
# dependency. CI turns it on for the ubuntu runner.
socketcan = ["dep:socketcan"]

[dependencies]
fieldbus-core = { path = "../core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One small well-known crate so every result file carries a hash of the
# manifest it was gated against, computed by the binary rather than asserted
# by the script that called it.
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "=4.0.0", optional = true }
