# Local monitoring reference. Administrative cloud endpoints are not Internet-safe.
services:
  cloud:
    build: {context: .., dockerfile: infra/Dockerfile}
    ports: ["127.0.0.1:${FIELDBUS_CLOUD_PORT:-8080}:8080"]
    volumes: [cloud-data:/var/lib/fieldbus]
    mem_limit: 256m
    cpus: 1
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${FIELDBUS_PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    cpus: 1
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:${FIELDBUS_GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/fieldbus.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/fieldbus.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/fieldbus.json:ro
    mem_limit: 256m
    cpus: 1
volumes:
  cloud-data: {}
  prometheus-data: {}
